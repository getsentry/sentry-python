name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@b2a6fa4904f37b46f34b82330e0f3bf02a40f681 # 3.13.0
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
