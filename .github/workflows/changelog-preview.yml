name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@7fe142107c12ea31eaaba10e4985674490bf808b # v2
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
