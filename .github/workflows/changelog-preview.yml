name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@6a763ab19893ff85c830b709fb5633a61924945e # 3.12.2
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
