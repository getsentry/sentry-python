name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@90e8e203ad86c8ab8ee134e8d387def13e620e81 # v3
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
