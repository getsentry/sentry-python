name: Changelog Preview
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@8a44f9201773f8c162ba046c9ac1b068de2a5386 # 3.14.1
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
